ServerTokens Prod
ServerSignature Off

<IfModule mod_headers.c>
    <LocationMatch "^/(robots\.txt|sitemap\.xml|OBRS/robots\.txt|OBRS/sitemap\.xml)$">
        Header always set Content-Security-Policy "default-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'"
        Header always set X-Content-Type-Options "nosniff"
    </LocationMatch>
</IfModule>
